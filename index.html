<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assembly Coach - Final Crop</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; margin: 0; font-family: system-ui, sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .active-step { background: linear-gradient(135deg, #1d4ed8, #2563eb); transform: scale(1.02); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const MAX_CONCURRENT_TASKS = 2; 

        function App() {
            const isMobile = window.location.pathname.includes('mobile');
            return isMobile ? <MobileView /> : <PCView />;
        }

        function MobileView() {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const wsRef = useRef(null);
            const [connected, setConnected] = useState(false);

            useEffect(() => {
                const init = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: 'environment', width: 640, height: 480 },
                            audio: false
                        });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                        const wsUrl = `${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws`;
                        wsRef.current = new WebSocket(wsUrl);
                        wsRef.current.onopen = () => setConnected(true);
                        wsRef.current.onclose = () => setConnected(false);

                        const send = () => {
                            if (wsRef.current?.readyState === 1 && videoRef.current?.readyState === 4) {
                                const ctx = canvasRef.current.getContext('2d');
                                ctx.drawImage(videoRef.current, 0, 0, 640, 480);
                                canvasRef.current.toBlob(b => {
                                    if(wsRef.current?.readyState === 1) wsRef.current.send(b);
                                }, 'image/jpeg', 0.4);
                            }
                            setTimeout(send, 200);
                        };
                        send();
                    } catch (e) { alert("카메라 권한을 확인하세요."); }
                };
                init();
            }, []);

            return (
                <div className="h-screen bg-black flex items-center justify-center relative">
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                    <canvas ref={canvasRef} style={{ display: 'none' }} width="640" height="480" />
                    <div className={`absolute bottom-12 px-8 py-4 rounded-full font-black text-white shadow-2xl ${connected ? 'bg-blue-600 animate-pulse' : 'bg-red-600'}`}>
                        {connected ? "LIVE COACHING ACTIVE" : "CONNECTING..."}
                    </div>
                </div>
            );
        }

        function PCView() {
            const [view, setView] = useState('landing');
            const [status, setStatus] = useState({ ai_feedback: '연결 중...', steps: [], current_step_idx: 0, has_frame: false, processing_tasks: 0, analysis_time: 0 });
            const [uploading, setUploading] = useState(false);
            const inputRef = useRef(null);

            useEffect(() => {
                const timer = setInterval(async () => {
                    try {
                        const res = await fetch('/status');
                        const data = await res.json();
                        // 데이터 안전하게 업데이트
                        setStatus(prev => ({
                            ...prev,
                            ...data,
                            steps: data.steps || []
                        }));
                        if (data.is_analyzed && view === 'upload') setView('coach');
                    } catch (e) {}
                }, 1000);
                return () => clearInterval(timer);
            }, [view]);

            const onUpload = async (e) => {
                const files = e.target.files;
                if (!files.length) return;
                setUploading(true);
                const fd = new FormData();
                for (let f of files) fd.append('files', f);
                try {
                    await fetch('/process-manual', { method: 'POST', body: fd });
                } catch(e) {
                    alert("업로드 실패");
                    setUploading(false);
                }
            };

            // 에러 방지: steps가 없을 경우 대비
            const currentStep = (status.steps && status.steps.length > 0) ? status.steps[status.current_step_idx] : null;

            return (
                <div className="min-h-screen text-white p-8 flex flex-col items-center justify-center">
                    {view === 'landing' && (
                        <div className="text-center">
                            <h1 className="text-8xl font-black mb-8 italic tracking-tighter bg-gradient-to-br from-blue-400 to-white bg-clip-text text-transparent">
                                CROP AI COACH
                            </h1>
                            <button onClick={() => setView('upload')} className="bg-blue-600 text-white px-16 py-6 rounded-2xl font-black text-2xl hover:scale-105 transition-all shadow-2xl">
                                시작하기
                            </button>
                        </div>
                    )}

                    {view === 'upload' && (
                        <div className="w-full max-w-xl glass p-12 rounded-[3rem] text-center border border-white/10">
                            <h2 className="text-4xl font-black mb-8">매뉴얼 정밀 분석</h2>
                            <div onClick={() => inputRef.current.click()} className="border-4 border-dashed border-slate-800 rounded-[2rem] p-20 cursor-pointer hover:bg-slate-900 transition-colors">
                                {uploading ? <p className="text-blue-500 font-bold animate-bounce text-xl">단계별 크롭 및 분석 중...</p> : <p className="text-slate-500 text-xl font-bold italic">설명서 파일 선택</p>}
                            </div>
                            <input type="file" multiple ref={inputRef} onChange={onUpload} className="hidden" />
                        </div>
                    )}

                    {view === 'coach' && (
                        <div className="w-full max-w-[1750px] flex gap-8 h-[88vh]">
                            <div className="w-1/4 glass rounded-[3rem] p-8 flex flex-col border border-white/5 shadow-2xl">
                                <div className="flex justify-between items-center mb-8 px-2">
                                    <h2 className="text-3xl font-black italic text-blue-400">GUIDE</h2>
                                    <span className="text-sm font-mono text-emerald-400">{status.analysis_time}s</span>
                                </div>
                                <div className="flex-1 space-y-4 overflow-y-auto pr-2 custom-scrollbar">
                                    {status.steps?.map((s, i) => (
                                        <div key={i} className={`p-6 rounded-3xl transition-all duration-500 ${i === status.current_step_idx ? 'active-step' : 'bg-slate-900/50 opacity-20'}`}>
                                            <p className="text-xs font-black mb-1 opacity-70">STEP {i + 1}</p>
                                            <p className="text-lg font-bold leading-tight">{s.title}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex-1 flex flex-col gap-6">
                                <div className="glass rounded-[3rem] p-8 relative overflow-hidden border-l-[12px] border-emerald-500 shadow-2xl">
                                    <div className="flex items-center gap-3 mb-2">
                                        <div className="flex gap-1">
                                            {[...Array(MAX_CONCURRENT_TASKS)].map((_, i) => (
                                                <div key={i} className={`w-2 h-2 rounded-full ${i < (status.processing_tasks || 0) ? 'bg-blue-500 animate-pulse' : 'bg-slate-800'}`}></div>
                                            ))}
                                        </div>
                                        <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">AI Vision Active</span>
                                    </div>
                                    <p className="text-4xl font-black leading-tight break-keep">{status.ai_feedback}</p>
                                </div>

                                <div className="flex-1 glass rounded-[4rem] overflow-hidden relative shadow-2xl bg-black border-4 border-slate-800">
                                    {status.has_frame ? (
                                        <img src="/stream" className="w-full h-full object-contain" alt="Live Feed" />
                                    ) : (
                                        <div className="w-full h-full flex flex-col items-center justify-center text-slate-700 bg-slate-950/40">
                                            <p className="text-2xl font-black mb-4">AWAITING CAMERA</p>
                                            <p className="font-mono text-sm opacity-50">{window.location.host}/mobile</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="w-1/4 flex flex-col gap-6">
                                <div className="flex-1 glass rounded-[3rem] p-8 flex flex-col border border-white/5 shadow-2xl overflow-hidden">
                                    <h2 className="text-2xl font-black mb-6 italic text-blue-400 uppercase tracking-tighter">Manual Focus</h2>
                                    {currentStep ? (
                                        <div className="flex-1 flex flex-col gap-6">
                                            <div className="bg-white rounded-2xl p-2 h-1/2 overflow-hidden shadow-inner border-2 border-slate-700">
                                                <img src={currentStep.image_url} className="w-full h-full object-contain" alt="Step Manual" />
                                            </div>
                                            <div className="p-6 bg-slate-800/50 rounded-2xl border border-white/10">
                                                <p className="text-blue-400 font-bold mb-2">Detailed Instruction</p>
                                                <p className="text-slate-300 leading-relaxed text-sm">{currentStep.desc}</p>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="flex-1 flex items-center justify-center text-slate-600 italic">분석 대기 중...</div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
