<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comm-Test: Fixed 1080x1920 Resolution</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; margin: 0; font-family: system-ui, sans-serif; overflow: hidden; color: white; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const isMobile = window.location.pathname.includes('mobile') || window.location.search.includes('view=mobile');
            return isMobile ? <MobileSender /> : <PCMonitor />;
        }

        function MobileSender() {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const wsRef = useRef(null);
            const [status, setStatus] = useState("Initializing...");
            const [connected, setConnected] = useState(false);
            const lastRTT = useRef(0);

            useEffect(() => {
                const init = async () => {
                    try {
                        // 🌟 Requesting FHD Portrait resolution
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { 
                                facingMode: 'environment',
                                width: { ideal: 1080 }, 
                                height: { ideal: 1920 } 
                            },
                            audio: false
                        });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                        
                        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                        const wsUrl = `${protocol}//${window.location.host}/ws`;
                        wsRef.current = new WebSocket(wsUrl);
                        
                        wsRef.current.onopen = () => { setConnected(true); setStatus("Connected (1080x1920)"); };
                        wsRef.current.onclose = () => { setConnected(false); setStatus("Disconnected"); };
                        
                        wsRef.current.onmessage = (msg) => {
                            const data = JSON.parse(msg.data);
                            if (data.pong) lastRTT.current = Date.now() - data.pong;
                        };

                        const sendFrame = () => {
                            const ws = wsRef.current;
                            if (ws?.readyState === 1 && videoRef.current?.readyState === 4) {
                                // 🌟 Backpressure check: Skip frame if buffer is full
                                if (ws.bufferedAmount > 0) {
                                    requestAnimationFrame(sendFrame);
                                    return;
                                }

                                const video = videoRef.current;
                                const canvas = canvasRef.current;
                                const ctx = canvas.getContext('2d');
                                
                                // 🌟 Fixed target resolution: 1080x1920
                                const targetW = 1080; 
                                const targetH = 1920;

                                if (canvas.width !== targetW) {
                                    canvas.width = targetW;
                                    canvas.height = targetH;
                                }

                                // Center Crop Logic to maintain 9:16 aspect ratio without stretching
                                const vW = video.videoWidth;
                                const vH = video.videoHeight;
                                const targetAspect = targetW / targetH;
                                
                                let sX, sY, sW, sH;
                                if ((vW / vH) > targetAspect) {
                                    sH = vH; sW = vH * targetAspect;
                                    sX = (vW - sW) / 2; sY = 0;
                                } else {
                                    sW = vW; sH = vW / targetAspect;
                                    sX = 0; sY = (vH - sH) / 2;
                                }

                                ctx.drawImage(video, sX, sY, sW, sH, 0, 0, targetW, targetH);
                                
                                const data = {
                                    data: canvas.toDataURL('image/jpeg', 0.4),
                                    send_time: Date.now(),
                                    rtt: lastRTT.current
                                };
                                ws.send(JSON.stringify(data));
                            }
                            // Attempt to send every 50ms
                            setTimeout(() => requestAnimationFrame(sendFrame), 50); 
                        };
                        sendFrame();
                    } catch (e) { setStatus("Error: " + e.message); }
                };
                init();
                return () => wsRef.current?.close();
            }, []);

            return (
                <div className="h-screen bg-black flex flex-col items-center justify-center relative">
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover opacity-80" />
                    <canvas ref={canvasRef} style={{ display: 'none' }} />
                    <div className="absolute top-10 px-6 py-2 rounded-full font-bold text-xs bg-black/70 border border-white/20">
                         One-way Latency: {Math.round(lastRTT.current/2)}ms
                    </div>
                    <div className={`absolute bottom-10 px-8 py-4 rounded-full font-black text-white shadow-2xl transition-all ${connected ? 'bg-blue-600' : 'bg-red-600'}`}>
                        {status}
                    </div>
                </div>
            );
        }

        function PCMonitor() {
            const [status, setStatus] = useState({ has_frame: false, ai_feedback: 'Waiting for Mobile...' });

            useEffect(() => {
                const timer = setInterval(async () => {
                    try {
                        const res = await fetch('/status');
                        const data = await res.json();
                        setStatus(data);
                    } catch (e) {}
                }, 500);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="min-h-screen bg-[#020617] text-white p-10 flex flex-col items-center gap-8">
                    <div className="text-center">
                        <h1 className="text-6xl font-black italic tracking-tighter bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent uppercase tracking-tight">1080x1920 Test</h1>
                        <p className="text-slate-500 mt-2 font-mono">Access: {window.location.host}/mobile</p>
                    </div>
                    <div className="w-full max-w-5xl flex flex-col gap-6">
                        <div className="glass rounded-[2.5rem] p-8 border-l-[12px] border-blue-600 shadow-2xl text-center">
                            <p className="text-3xl font-bold">{status.ai_feedback}</p>
                        </div>
                        <div className="glass rounded-[3rem] overflow-hidden border-4 border-slate-900 bg-black flex items-center justify-center aspect-[9/16] max-h-[70vh] mx-auto">
                            {status.has_frame ? (
                                <img src="/stream" className="w-full h-full object-contain" alt="FHD Stream" />
                            ) : (
                                <div className="animate-pulse text-slate-700">AWAITING FHD STREAM...</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
