<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assembly Coach - WebRTC Navigator</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
    <style>
        body { background-color: #020617; margin: 0; font-family: system-ui, sans-serif; overflow: hidden; color: white; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); }
        .active-user-step {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: scale(1.03);
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .clickable { cursor: pointer; pointer-events: auto !important; }
        .step-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; z-index: 10; }

        .nav-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-weight: 900; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
            border-radius: 1.5rem; padding: 14px 0; flex: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: none; cursor: pointer;
        }
        .nav-btn:active:not(:disabled) { transform: scale(0.95); }
        .nav-btn-prev { background: rgba(51,65,85,0.6); color: #94a3b8; border: 1px solid rgba(255,255,255,0.07); }
        .nav-btn-prev:hover:not(:disabled) { background: rgba(71,85,105,0.8); color: #e2e8f0; border-color: rgba(255,255,255,0.15); }
        .nav-btn-next { background: linear-gradient(135deg,#2563eb,#1d4ed8); color: white; box-shadow: 0 8px 20px rgba(37,99,235,0.35); }
        .nav-btn-next:hover:not(:disabled) { background: linear-gradient(135deg,#3b82f6,#2563eb); box-shadow: 0 12px 28px rgba(37,99,235,0.5); transform: translateY(-1px); }
        .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .step-img-wrap {
            width: 100%; aspect-ratio: 16/9; background: white; border-radius: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0; cursor: zoom-in;
            transition: box-shadow 0.2s;
        }
        .step-img-wrap:hover { box-shadow: 0 0 0 3px rgba(37,99,235,0.5); }
        .step-img-wrap img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; transition:transform 0.4s ease; }
        .step-img-wrap:hover img { transform: scale(1.06); }

        /* ✨ 하드웨어/시각화 추가 스타일 */
        .mirror-mode { transform: scaleX(-1); }
        .osd-shadow { text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .img-modal-backdrop {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(2,6,23,0.93); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: center;
        }
        .progress-dot { width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; transition:all 0.4s ease; }
        .progress-dot.done  { background:#10b981; color:white; }
        .progress-dot.active { background:#2563eb; color:white; animation:dot-pulse 1.2s infinite; }
        .progress-dot.waiting { background:rgba(30,41,59,0.8); color:#475569; border:1px solid rgba(255,255,255,0.06); }
        @keyframes dot-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,0.5)} 50%{box-shadow:0 0 0 8px rgba(37,99,235,0)} }
        .complete-pop { animation: complete-pop 0.55s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        @keyframes complete-pop { 0%{transform:scale(0.7);opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
        /* ✨ 3번: 브라우저 가로 레이아웃 고정 스타일 */
/* ✨ 영상을 크게 만들고 거울 모드를 확실히 적용 */
.video-fixed-ratio {
    width: 95%; /* 🚀 중앙 영역의 95%를 차지하도록 확대 */
    max-width: 1400px; /* 최대 너비 제한 (너무 퍼지는 것 방지) */
    aspect-ratio: 16 / 9; /* 🚀 16:9 가로 비율 고정 */
    background: #000;
    border-radius: 3rem;
    overflow: hidden;
    position: relative;
    border: 3px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
    margin: 0 auto; /* 가로 중앙 정렬 */
}

.video-fixed-ratio img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* 🚀 검은 여백 없이 꽉 채우기 */
}

/* 🚀 거울 모드 (이미지를 좌우로 반전) */
.mirror-mode {
    transform: scaleX(-1) !important;
}
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const LIVEKIT_URL = "wss://capstone-project-jvy5e1z6.livekit.cloud";
    const MOBILE_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3Nzc0OTMyOTYsImlkZW50aXR5IjoibWIiLCJpc3MiOiJBUElhWkpDOVE4cjJTeU4iLCJuYmYiOjE3Nzc0NTcyOTYsInN1YiI6Im1iIiwidmlkZW8iOnsiY2FuUHVibGlzaCI6dHJ1ZSwiY2FuUHVibGlzaERhdGEiOnRydWUsImNhblN1YnNjcmliZSI6dHJ1ZSwicm9vbSI6ImNkIiwicm9vbUpvaW4iOnRydWV9fQ.CAQj2czWzd3pAH_2ssAvSvoZHJC8fIIoXGruJNyoMDY";

    /* ── [복구] 모바일 전용 송출 뷰 ── */
    /* ── [수정] 모바일 전용 송출 뷰 (좌우 반전 토글 적용) ── */
    /* ── [최종 고정 버전] 모바일 전용 송출 뷰 (좌우 반전 고정) ── */
    function MobileView() {
        const videoRef = useRef(null);
        const [connected, setConnected] = useState(false);
        const [currentAbs, setCurrentAbs] = useState(0);

        useEffect(() => {
            const init = async () => {
                try {
                    const LK = window.LivekitClient;
                    const room = new LK.Room();
                    await room.connect(LIVEKIT_URL, MOBILE_TOKEN);

                    const tracks = await window.LivekitClient.createLocalTracks({
                        video: { 
                            facingMode: 'environment', // 후면 카메라
                            width: { ideal: 1280 }, 
                            height: { ideal: 720 }, 
                            frameRate: 30 
                        }
                    });

                    const videoTrack = tracks.find(t => t.kind === 'video');
                    if (videoRef.current && videoTrack) videoTrack.attach(videoRef.current);

                    await room.localParticipant.publishTrack(videoTrack, { 
                        simulcast: false, 
                        videoEncoding: {
                            maxBitrate: 3_000_000, // 3Mbps
                        },
                        priority: 'high' 
                    });
                    
                    setConnected(true);
                } catch (e) { alert("연결 에러: " + e.message); }
            };
            init();
        }, []);

        return (
            <div className="h-screen bg-black flex flex-col items-center justify-center relative overflow-hidden">
                {/* ✨ 버튼을 없애고, Tailwind의 좌우반전 클래스(-scale-x-100)를 기본으로 고정했습니다. */}
                <video 
                    ref={videoRef} 
                    autoPlay 
                    playsInline 
                    muted 
                    className="w-full h-full object-cover opacity-70" 
                />
                
                <div className="absolute top-10 px-6 py-2 rounded-full font-bold text-xs bg-black/60 border border-white/20 backdrop-blur-md text-blue-400">
                    📡 TRANSMITTER MODE | ABS: {currentAbs}ms
                </div>
                
                <div className={`absolute bottom-20 px-10 py-5 rounded-full font-black text-white border-2 ${connected ? 'bg-blue-600 border-blue-400 active-glow' : 'bg-red-600 animate-pulse'}`}>
                    {connected ? "LIVE STREAMING ACTIVE" : "CONNECTING..."}
                </div>
            </div>
        );
    }

    /* ── 분석 단계 컴포넌트 ── */
    function UploadProgress({ status, onCancel }) {
        const STEPS = [
            { id:'upload',  label:'파일 업로드',   desc:'서버 전송 중' },
            { id:'render',  label:'페이지 렌더링', desc:'이미지 변환 중' },
            { id:'analyze', label:'AI 지시문 추출', desc:'Gemini 분석 중' },
            { id:'done',    label:'완료',           desc:'이동 중' },
        ];
        const curIdx = Math.max(0, STEPS.findIndex(s => s.id === (status.progress_step || 'upload')));
        return (
            <div className="w-full max-w-xl glass p-10 rounded-[3rem] shadow-2xl animate-in slide-in-from-bottom-10 duration-500">
                <h2 className="text-4xl font-black mb-2 text-blue-400 text-center">매뉴얼 분석 중</h2>
                <p className="text-slate-500 text-sm mb-8 font-mono text-center">{status.analysis_time}s 분석 경과</p>
                <div className="space-y-2 mb-8">
                    {STEPS.map((s, i) => {
                        const st = i < curIdx ? 'done' : i === curIdx ? 'active' : 'waiting';
                        return (
                            <div key={s.id} className="flex items-center gap-3 py-2">
                                <div className={`progress-dot ${st}`}>{st === 'done' ? '✓' : i + 1}</div>
                                <div className="flex-1 font-black text-sm">{s.label}</div>
                                {st === 'active' && <div className="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" />}
                            </div>
                        );
                    })}
                </div>
                <button onClick={onCancel} className="w-full py-3 rounded-2xl bg-slate-900 border border-white/6 text-slate-500 text-[11px] font-black uppercase tracking-widest transition-all">✕ 취소</button>
            </div>
        );
    }

    /* ── 완료 화면 ── */
    function CompletionOverlay({ totalSteps, onRestart }) {
        return (
            <div className="img-modal-backdrop">
                <div className="flex flex-col items-center gap-8 complete-pop text-center">
                    <div className="w-28 h-28 rounded-full bg-emerald-500/20 border-2 border-emerald-500/40 flex items-center justify-center text-6xl">🏁</div>
                    <div>
                        <h2 className="text-6xl font-black italic tracking-tighter mb-3 bg-gradient-to-br from-emerald-400 via-white to-blue-400 bg-clip-text text-transparent uppercase">Assembly Done!</h2>
                        <p className="text-slate-400 text-lg font-medium">총 <span className="text-white font-black">{totalSteps}단계</span>를 완료했습니다.</p>
                    </div>
                    <div className="flex gap-4">
                        <button onClick={onRestart} className="px-10 py-4 rounded-2xl bg-slate-800 text-slate-300 font-black text-sm hover:bg-slate-700 transition-all border border-white/10">처음으로</button>
                        <button onClick={() => { fetch('/reset', {method:'POST'}); window.location.reload(); }} className="px-10 py-4 rounded-2xl bg-blue-600 text-white font-black text-sm hover:bg-blue-500 transition-all shadow-lg shadow-blue-500/30">새 매뉴얼</button>
                    </div>
                </div>
            </div>
        );
    }

    /* ── PC 메인 코칭 뷰 ── */
    function PCView() {
        const [view, setView] = useState('landing');
        const [status, setStatus] = useState({ ai_response:'대기 중...', manual_steps:[], current_step_idx:0, has_frame:false, analysis_time:0, is_analyzed:false, step_locked:false, progress_step:'upload', current_fps:0, last_rtt:0 });
        const [uploading, setUploading] = useState(false);
        const [userSelectedIdx, setUserSelectedIdx] = useState(null);
        const [modalImg, setModalImg] = useState(null);
        const [showComplete, setShowComplete] = useState(false);
        const [ttsOn, setTtsOn] = useState(true);
        const [isAnalyzing, setIsAnalyzing] = useState(false);
        const inputRef = useRef(null);
        const listRef = useRef(null);
        const stepRefs = useRef([]);

        useEffect(() => {
            const timer = setInterval(async () => {
                try {
                    const res = await fetch('/status');
                    const data = await res.json();
                    setStatus(data);
                    if (data.is_analyzed && data.manual_steps?.length > 0 && view === 'upload' && !uploading) {
                        setView('coach');
                    }
                } catch(e) {}
            }, 1000);
            return () => clearInterval(timer);
        }, [view, uploading]);

        const uploadFiles = async (files) => {
            if (!files || !files.length) return;
            setUploading(true); setView('upload');
            const fd = new FormData();
            for (let f of files) fd.append('files', f);
            try { await fetch('/process-manual', { method:'POST', body:fd }); setUploading(false); }
            catch(e) { setUploading(false); setView('landing'); }
        };

        const triggerVLM = async () => {
            if (isAnalyzing || !status.has_frame) return;
            setIsAnalyzing(true);
            try { await fetch('/trigger-vlm', { method: 'POST' }); }
            finally { setIsAnalyzing(false); }
        };

        const activeIdx = userSelectedIdx !== null ? userSelectedIdx : status.current_step_idx;
        const currentStep = status.manual_steps[activeIdx];
        const totalSteps = status.manual_steps.length;

        const forceSetStep = async (newIdx) => {
            const clamped = Math.max(0, Math.min(newIdx, totalSteps - 1));
            setUserSelectedIdx(clamped);
            await fetch('/set-step', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ idx:clamped, locked:true }) });
        };

        const goHome = async () => { await fetch('/reset', { method: 'POST' }); setView('landing'); setUploading(false); setUserSelectedIdx(null); };

        return (
    <div className="min-h-screen bg-[#020617] text-white p-6 flex flex-col items-center justify-center overflow-hidden">
        {/* 1. 완료 팝업 및 이미지 상세 모달 */}
        {showComplete && <CompletionOverlay totalSteps={totalSteps} onRestart={() => { setShowComplete(false); forceSetStep(0); }} />}
        {modalImg && (
            <div className="img-modal-backdrop" onClick={() => setModalImg(null)}>
                <div className="relative max-w-5xl px-4" onClick={e => e.stopPropagation()}>
                    <img src={modalImg.src} className="rounded-3xl shadow-2xl w-full border border-white/10" />
                    <button className="absolute -top-4 -right-4 w-10 h-10 bg-white text-black rounded-full font-black shadow-lg" onClick={() => setModalImg(null)}>✕</button>
                </div>
            </div>
        )}

        {/* 2. 랜딩 페이지 (시작 화면) */}
        {view === 'landing' && (
            <div className="flex flex-col items-center gap-10 animate-in fade-in duration-700">
                <h1 className="text-8xl font-black italic tracking-tighter uppercase opacity-90">Start</h1>
                <div className="flex gap-6 w-full max-w-4xl px-10">
                    <div className="flex-1 glass p-10 rounded-[3rem] text-center border border-white/5 hover:border-blue-500 transition-all cursor-pointer"
                        onClick={() => { fetch('/reset', {method:'POST'}); setView('upload'); }}>
                        <div className="text-6xl mb-6">📁</div>
                        <h2 className="text-2xl font-black mb-2 uppercase">New Guide</h2>
                        <p className="text-slate-500 text-sm">새 매뉴얼 업로드</p>
                    </div>
                    {status.is_analyzed && (
                        <div className="flex-1 glass p-10 rounded-[3rem] text-center border-2 border-emerald-500/30 hover:border-emerald-500 transition-all cursor-pointer"
                            onClick={() => setView('coach')}>
                            <div className="text-6xl mb-6">🔖</div>
                            <h2 className="text-2xl font-black mb-2 uppercase text-emerald-400">Resume</h2>
                            <p className="text-slate-500 text-sm">STEP {status.current_step_idx + 1}부터 계속</p>
                        </div>
                    )}
                </div>
            </div>
        )}

        {/* 3. 업로드 및 분석 대기 화면 */}
        {view === 'upload' && (
            <div className="w-full flex items-center justify-center">
                {uploading ? <UploadProgress status={status} onCancel={goHome} /> : (
                    <div className="glass p-20 rounded-[4rem] text-center border-2 border-dashed border-slate-700 hover:border-blue-500 cursor-pointer" onClick={() => inputRef.current.click()}>
                        <div className="text-8xl mb-6">📄</div>
                        <h2 className="text-4xl font-black mb-4 uppercase">Select Manual</h2>
                        <input type="file" multiple ref={inputRef} onChange={(e) => uploadFiles(e.target.files)} className="hidden" accept=".pdf,image/*" />
                    </div>
                )}
            </div>
        )}

        {/* 4. 메인 코칭 화면 (카메라 및 가이드) */}
        {view === 'coach' && (
            <div className="w-full max-w-[1700px] flex gap-8 h-[88vh] animate-in fade-in duration-1000">
                
                {/* [왼쪽] 단계 리스트 */}
                <div className="w-1/4 flex flex-col gap-3">
                    <div className="flex-1 glass rounded-[3rem] p-6 flex flex-col border border-white/5 overflow-hidden">
                        <h2 className="text-2xl font-black italic text-blue-400 uppercase tracking-tighter mb-6">Steps</h2>
                        <div ref={listRef} className="flex-1 space-y-4 overflow-y-auto pr-2 custom-scrollbar">
                            {status.manual_steps.map((s, i) => (
                                <div key={i} ref={el => stepRefs.current[i] = el} onClick={() => forceSetStep(i)}
                                    className={`p-5 rounded-[2rem] clickable border ${i === activeIdx ? 'active-user-step border-transparent' : 'bg-slate-900/40 border-white/5 opacity-60'}`}>
                                    <span className="text-[10px] font-black opacity-70 uppercase tracking-widest">STEP {s.step}</span>
                                    <p className="text-base font-bold leading-tight break-keep">{s.title}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                    <button onClick={goHome} className="py-4 rounded-[1.5rem] bg-slate-900/70 border border-white/6 text-slate-400 font-black uppercase text-xs">홈으로</button>
                </div>

                {/* [중앙] 메인 영상 피드 (크기 확대 및 카메라 연결) */}
                {/* [중앙] 메인 영상 피드 (크기 확대 및 카메라 연결) */}
<div className="flex-1 flex flex-col justify-center items-center">
    <div className="video-fixed-ratio">
        {status.has_frame ? (
            /* ✨ 여기에 -scale-x-100 을 다시 확실하게 넣어줍니다! */
            <img src="/stream" className="-scale-x-100 w-full h-full object-cover" alt="Live Feed" />
        ) : (
            <div className="w-full h-full flex flex-col items-center justify-center text-slate-700 bg-slate-950">
                <div className="w-16 h-16 border-4 border-slate-800 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                <p className="font-black italic text-2xl uppercase tracking-tighter text-center px-10">Awaiting Hardware Feed...</p>
            </div>
                        )}

                        {/* 영상 위 지표(OSD) */}
                        <div className="absolute top-8 left-8 flex gap-4 z-20">
                            <div className="glass px-4 py-2 rounded-2xl text-xs font-mono text-slate-200 border-white/5 osd-shadow">
                                FPS: {Math.round(status.current_fps)}
                            </div>
                            <div className="glass px-4 py-2 rounded-2xl text-xs font-mono text-slate-200 border-white/5 osd-shadow">
                                ABS: {Math.round(status.last_rtt/2)}ms
                            </div>
                        </div>

                        {/* VLM 분석 버튼 */}
                        {status.has_frame && (
                            <button onClick={triggerVLM} disabled={isAnalyzing} 
                                className="absolute top-8 right-8 px-6 py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-black shadow-2xl transition-all active:scale-95 disabled:bg-slate-800 z-20">
                                {isAnalyzing ? 'ANALYZING...' : '🔍 VLM 분석'}
                            </button>
                        )}
                    </div>
                    
                    {/* AI 코칭 응답 섹션 */}
                    <div className="w-full max-w-[1400px] mt-4 glass p-8 rounded-[3rem] border border-white/5">
                        <p className="text-blue-400 font-bold text-xs uppercase mb-2">AI Coaching</p>
                        <p className="text-4xl font-black leading-tight break-keep">{status.ai_response}</p>
                    </div>
                </div>

                {/* [오른쪽] 가이드 정보 및 네비게이션 */}
                <div className="w-1/4 flex flex-col gap-4">
                    <div className="flex-1 glass rounded-[3rem] p-5 flex flex-col border border-white/5 overflow-hidden">
                        {currentStep ? (
                            <div className="flex-1 flex flex-col gap-3 overflow-hidden">
                                <div className="step-img-wrap" onClick={() => setModalImg({ src:currentStep.image_url, title:`STEP ${currentStep.step}` })}>
                                    <img src={currentStep.image_url} alt="Step Guide" />
                                </div>
                                <div className="flex-1 bg-slate-950/50 rounded-[1.5rem] p-5 border border-white/5 overflow-y-auto custom-scrollbar">
                                    <p className="text-blue-300 font-black uppercase text-[10px] tracking-widest mb-1">STEP {currentStep.step}</p>
                                    <p className="text-slate-100 leading-relaxed break-keep text-[15px]">{currentStep.desc}</p>
                                </div>
                            </div>
                        ) : <div className="flex-1 flex items-center justify-center text-slate-800 font-black italic">No Data</div>}
                    </div>
                    
                    {/* 컨트롤 버튼 */}
                    <div className="glass rounded-[2.5rem] p-5 border border-white/5 shadow-xl flex flex-col gap-3">
                        <div className="flex gap-3">
                            <button onClick={() => forceSetStep(activeIdx - 1)} disabled={activeIdx === 0} className="nav-btn nav-btn-prev">PREV</button>
                            <button onClick={() => (activeIdx >= totalSteps - 1 ? setShowComplete(true) : forceSetStep(activeIdx + 1))} className="nav-btn nav-btn-next">
                                {activeIdx >= totalSteps - 1 ? 'FINISH' : 'NEXT'}
                            </button>
                        </div>
                        <div className="flex justify-between px-2 text-[9px] font-bold text-slate-500 uppercase tracking-widest">
                            <span>{userSelectedIdx !== null ? "⚡ 수동 모드" : "🤖 AI 추적 중"}</span>
                            <span>{activeIdx + 1} / {totalSteps}</span>
                        </div>
                    </div>
                </div>

            </div>
        )}
    </div>
);
    }

    /* ── [핵심] 분기 처리 로직 ── */
    /* ── [수정] index.html의 맨 마지막 AppWrapper 부분 ── */

function AppWrapper() {
    // 주소창에 /mobile 이 포함되어 있는지 확인
    const isMobilePath = window.location.pathname.includes('/mobile');
    
    // 모바일 경로면 MobileView(송출기)를, 아니면 PCView(코치)를 보여줌
    return isMobilePath ? <MobileView /> : <PCView />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppWrapper />);
</script>
</body>
</html>
