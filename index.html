<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary ABS Reporter (1080x1920)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; margin: 0; font-family: system-ui, sans-serif; overflow: hidden; color: white; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const isMobile = window.location.pathname.includes('mobile') || window.location.search.includes('view=mobile');
            return isMobile ? <MobileSender /> : <PCMonitor />;
        }

        function MobileSender() {
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const wsRef = useRef(null);
            const [connected, setConnected] = useState(false);
            const lastRtt = useRef(0); // 마지막 측정된 RTT 저장

            useEffect(() => {
                const init = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { 
                                facingMode: 'environment', 
                                width: { ideal: 1080 }, 
                                height: { ideal: 1920 } 
                            }
                        });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                        
                        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                        wsRef.current = new WebSocket(`${protocol}//${window.location.host}/ws`);
                        wsRef.current.binaryType = "arraybuffer"; 

                        wsRef.current.onopen = () => setConnected(true);
                        wsRef.current.onmessage = (e) => {
                            const view = new Float64Array(e.data);
                            // 서버에서 즉시 반환한 시간을 바탕으로 RTT 계산
                            lastRtt.current = Date.now() - view[0];
                        };

                        const sendFrame = () => {
                            const ws = wsRef.current;
                            if (ws?.readyState === 1 && videoRef.current?.readyState === 4) {
                                // Backpressure: 전송 버퍼가 차있으면 프레임 드랍
                                if (ws.bufferedAmount > 0) {
                                    requestAnimationFrame(sendFrame);
                                    return;
                                }

                                const video = videoRef.current;
                                const canvas = canvasRef.current;
                                const ctx = canvas.getContext('2d');
                                
                                // 🌟 해상도 설정: 1080x1920 고정
                                const targetW = 1080; 
                                const targetH = 1920;
                                if (canvas.width !== targetW) { canvas.width = targetW; canvas.height = targetH; }

                                // 중앙 크롭 로직 (9:16 비율 유지)
                                const vW = video.videoWidth;
                                const vH = video.videoHeight;
                                const aspect = targetW / targetH;
                                let sX, sY, sW, sH;
                                if ((vW / vH) > aspect) {
                                    sH = vH; sW = vH * aspect;
                                    sX = (vW - sW) / 2; sY = 0;
                                } else {
                                    sW = vW; sH = vW / aspect;
                                    sX = 0; sY = (vH - sH) / 2;
                                }

                                ctx.drawImage(video, sX, sY, sW, sH, 0, 0, targetW, targetH);
                                
                                // 🌟 Binary 전송: 16바이트 헤더 [발송시간, RTT] 포함
                                canvas.toBlob((blob) => {
                                    const sendTime = Date.now();
                                    const headerBuffer = new ArrayBuffer(16);
                                    const headerView = new Float64Array(headerBuffer);
                                    headerView[0] = sendTime;
                                    headerView[1] = lastRtt.current;

                                    const combined = new Blob([headerBuffer, blob]);
                                    ws.send(combined);
                                }, 'image/jpeg', 0.4);
                            }
                            setTimeout(() => requestAnimationFrame(sendFrame), 50); 
                        };
                        sendFrame();
                    } catch (e) { console.error("Camera error:", e); }
                };
                init();
                return () => wsRef.current?.close();
            }, []);

            return (
                <div className="h-screen bg-black flex flex-col items-center justify-center relative">
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover opacity-60" />
                    <canvas ref={canvasRef} style={{ display: 'none' }} />
                    <div className="absolute top-10 px-6 py-2 rounded-full font-bold text-xs bg-black/50 border border-white/20">
                         Current ABS: {Math.round(lastRtt.current/2)}ms | 1080x1920
                    </div>
                    <div className={`absolute px-8 py-4 rounded-full font-black text-white ${connected ? 'bg-blue-600 shadow-lg' : 'bg-red-600'}`}>
                        {connected ? "FHD BINARY STREAMING" : "CONNECTING..."}
                    </div>
                </div>
            );
        }

        function PCMonitor() {
            const [status, setStatus] = useState({ log: 'Waiting for stream...' });

            useEffect(() => {
                const timer = setInterval(async () => {
                    try {
                        const res = await fetch('/status');
                        const data = await res.json();
                        setStatus(data);
                    } catch (e) {}
                }, 500);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="min-h-screen bg-[#020617] text-white p-10 flex flex-col items-center gap-8">
                    <h1 className="text-5xl font-black italic tracking-tighter text-blue-500 uppercase">FHD Binary ABS Monitor</h1>
                    <div className="w-full max-w-4xl glass p-8 border-l-[12px] border-blue-600 shadow-2xl">
                        <p className="text-sm font-black text-blue-400 uppercase mb-2">Server-Side Metrics</p>
                        <p className="text-xl font-mono break-all bg-black/30 p-4 rounded-xl border border-white/5">{status.log}</p>
                    </div>
                    <div className="aspect-[9/16] h-[65vh] glass rounded-[3rem] overflow-hidden border-4 border-slate-900 bg-black">
                        <img src="/stream" className="w-full h-full object-contain" />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
