<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assembly Coach</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg:        #f5f5f7;
            --bg-2:      #ffffff;
            --bg-3:      #fbfbfd;
            --ink:       #1d1d1f;
            --ink-2:     #424245;
            --ink-3:     #6e6e73;
            --ink-4:     #a1a1a6;
            --line:      rgba(0,0,0,0.10);
            --line-2:    rgba(0,0,0,0.06);
            --accent:    #0071e3;
            --accent-soft:#e8f0fe;
            --good:      #00875a;
            --warn:      #8a6b00;
            --bad:       #b3261e;

            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard Variable", Pretendard, ui-sans-serif, system-ui, "Helvetica Neue", sans-serif;
            --font-mono: "SF Mono", ui-monospace, "Geist Mono", Menlo, monospace;
            --font-serif:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard Variable", sans-serif;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-sans);
            font-feature-settings: "ss01","cv11";
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow: hidden;
        }

        .mono { font-family: var(--font-mono); letter-spacing: 0.02em; }
        .label {
            font-family: var(--font-sans);
            font-size: 12px;
            letter-spacing: 0.01em;
            color: var(--accent);
            font-weight: 600;
        }
        .surface {
            background: var(--bg-2);
            border: 1px solid var(--line-2);
            border-radius: 18px;
        }
        .hairline { border: 1px solid var(--line); }

        .btn-spline {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: var(--font-sans); font-size: 14px; letter-spacing: -0.01em;
            font-weight: 500;
            padding: 12px 26px;
            border-radius: 980px;
            background: var(--ink); color: #fff;
            border: 1px solid var(--ink);
            cursor: pointer; transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-spline:hover:not(:disabled) { background: #424245; border-color: #424245; color: #fff; }
        .btn-spline.ghost { background: transparent; color: var(--ink); }
        .btn-spline.ghost:hover:not(:disabled) { background: #f5f5f7; border-color: var(--ink); color: var(--ink); }
        .btn-spline:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-spline:active:not(:disabled) { transform: translateY(1px); }

        .btn-quiet {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: var(--font-sans); font-size: 13px; font-weight: 500;
            letter-spacing: -0.005em;
            padding: 11px 16px;
            background: var(--bg-2); color: var(--ink-2);
            border: 1px solid var(--line);
            border-radius: 980px;
            cursor: pointer; transition: all 0.18s ease;
        }
        .btn-quiet:hover:not(:disabled) { background: #f5f5f7; color: var(--ink); border-color: rgba(0,0,0,0.18); }
        .btn-quiet:disabled { opacity: 0.3; cursor: not-allowed; }

        .scroll::-webkit-scrollbar { width: 4px; }
        .scroll::-webkit-scrollbar-track { background: transparent; }
        .scroll::-webkit-scrollbar-thumb { background: rgba(17,17,17,0.12); border-radius: 999px; }
        .scroll::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,0.25); }

        .step-row {
            position: relative;
            padding: 22px 18px 22px 22px;
            border-bottom: 1px solid var(--line-2);
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .step-row:hover { background: rgba(17,17,17,0.02); }
        .step-row[data-active="true"] { background: #f5f5f7; }
        .substep-row {
            position: relative;
            border-bottom: 1px solid var(--line-2);
            background: rgba(17,17,17,0.015);
            transition: background 0.15s ease;
        }
        .substep-row:hover { background: rgba(0,113,227,0.05); }
        .substep-row[data-active="true"] { background: rgba(0,113,227,0.08); }
        .substep-row[data-active="true"]::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--accent);
        }
        .step-row[data-active="true"]::before {
            content: ""; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--ink);
        }
        .step-row[data-aifocus="true"]::after {
            content: ""; position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
            box-shadow: 0 0 0 4px rgba(0,113,227,0.12);
            animation: ai-pulse 1.8s ease-in-out infinite;
        }
        @keyframes ai-pulse {
            0%,100% { box-shadow: 0 0 0 4px rgba(0,113,227,0.12); }
            50%     { box-shadow: 0 0 0 8px rgba(0,113,227,0.04); }
        }

        .img-well {
            width: 100%; flex: 1;
            background: var(--bg);
            border: 1px solid var(--line-2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; cursor: zoom-in;
            transition: border-color 0.18s ease;
            position: relative; min-height: 0;
        }
        .img-well:hover { border-color: var(--ink); }
        .img-well img { width:100%; height:100%; object-fit:contain; }
        .img-well.multi { gap:8px; padding:8px; }
        .img-well.multi img { flex:1 1 0; min-width:0; width:auto; height:100%; object-fit:contain; cursor:zoom-in; }
        .img-well-placeholder {
            width: 100%; height: 100%;
            background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(17,17,17,0.04) 8px 9px);
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-4); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em;
        }

        .stream-frame {
            background: #000;
            border: 1px solid var(--line-2);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
        }
        .camera-shutter {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 28;
            animation: shutter-flash 1100ms ease-out both;
        }
        .camera-shutter::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.82);
            animation: shutter-wash 1100ms ease-out both;
        }
        .camera-shutter::after {
            content: "";
            position: absolute;
            inset: 16px;
            border: 2px solid rgba(255,255,255,0.95);
            box-shadow: 0 0 0 999px rgba(0,0,0,0.14), 0 0 28px rgba(255,255,255,0.38);
            animation: shutter-frame 1100ms cubic-bezier(.2,.8,.2,1) both;
        }
        @keyframes shutter-flash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes shutter-wash {
            0% { opacity: 0; }
            8% { opacity: 1; }
            42% { opacity: 0.12; }
            100% { opacity: 0; }
        }
        @keyframes shutter-frame {
            0% { opacity: 0; transform: scale(1.08); }
            14% { opacity: 1; transform: scale(0.965); }
            58% { opacity: 0.72; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.025); }
        }

        .stat-dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: var(--ink-4); margin-right: 8px; vertical-align: middle;
        }
        .stat-dot.live { background: var(--good); animation: live-pulse 1.8s infinite; }
        .stat-dot.warn { background: var(--warn); animation: live-pulse 1.4s infinite; }
        .stat-dot.bad  { background: var(--bad);  animation: live-pulse 0.9s infinite; }
        @keyframes live-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        .pdot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center;
                font-family: var(--font-mono); font-size: 10px; font-weight: 500;
                border: 1px solid var(--line); background: var(--bg-2); color: var(--ink-3);
                transition: all 0.3s ease; }
        .pdot.done   { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .pdot.active { background: var(--accent); color: white; border-color: var(--accent); }

        .modal-back {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(245,245,247,0.86);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: flex; align-items: center; justify-content: center;
            animation: fade-in 0.2s ease-out;
        }
        @keyframes fade-in { from{opacity:0} to{opacity:1} }
        .modal-card {
            position: relative; max-width: 86vw; max-height: 86vh;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
        }
        .modal-card img {
            max-width: 100%; max-height: 78vh; object-fit: contain;
            background: white; border: 1px solid var(--line-2); border-radius: 14px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
        }
        .modal-close {
            position: absolute; top: -8px; right: -8px;
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid var(--line-2); background: var(--bg-2); color: var(--ink);
            cursor: pointer; font-size: 14px; font-family: var(--font-mono);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s; box-shadow: 0 2px 8px rgba(17,17,17,0.06);
        }
        .modal-close:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

        .dropzone {
            border: 1px dashed var(--line);
            border-radius: 14px;
            padding: 56px 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.18s ease;
            background: var(--bg);
        }
        .dropzone:hover { border-color: var(--ink-3); background: var(--bg-2); }
        .dropzone[data-drag="true"] { border-color: var(--accent); background: var(--accent-soft); }
        .dz-icon {
            width: 40px; height: 40px; margin: 0 auto 16px;
            border: 1px solid var(--line); border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-3);
        }

        .toast {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            z-index: 500; padding: 10px 18px;
            background: var(--ink); color: #fff;
            border-radius: 980px;
            font-family: var(--font-sans); font-size: 13px; font-weight: 500;
            letter-spacing: -0.005em;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 12px 32px rgba(17,17,17,0.18);
            animation: toast-in 0.22s ease-out;
        }
        @keyframes toast-in { from{opacity:0;transform:translate(-50%,12px)} to{opacity:1;transform:translate(-50%,0)} }

        /* 사이드바 슬라이드 */
        .sidebar {
            transition: width 0.3s cubic-bezier(0.4,0,0.2,1),
                        opacity 0.25s ease,
                        min-width 0.3s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }
        .sidebar-toggle {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 20px; height: 48px;
            background: var(--bg-2); border: 1px solid var(--line-2);
            border-left: none; border-radius: 0 6px 6px 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--ink-3); font-size: 10px;
            transition: all 0.2s; z-index: 10;
        }
        .sidebar-toggle:hover { background: var(--bg); color: var(--ink); }

        /* 스텝 툴팁 — CSS로는 fixed 불가, JS로 처리 */
        .step-tooltip-box {
            position: fixed;
            background: var(--ink); color: var(--bg-2);
            padding: 8px 12px; border-radius: 8px;
            font-size: 12px; font-weight: 500; line-height: 1.5;
            max-width: 240px; pointer-events: none; z-index: 9999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: opacity 0.15s ease;
        }
        .step-tooltip-box::before {
            content: ''; position: absolute; right: 100%; top: 14px;
            border: 5px solid transparent; border-right-color: var(--ink);
        }

        .infer-btn {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: var(--font-sans); font-size: 12px; font-weight: 600;
            letter-spacing: -0.005em;
            padding: 7px 14px; border-radius: 980px;
            cursor: pointer; transition: all 0.2s ease;
            white-space: nowrap; border: 1px solid transparent;
        }
        .infer-btn.off {
            background: var(--bg); color: var(--ink-3);
            border-color: var(--line);
        }
        .infer-btn.off:hover { background: var(--bg-2); color: var(--ink-2); border-color: rgba(0,0,0,0.15); }
        .infer-btn.on {
            background: var(--ink); color: #fff;
            border-color: var(--ink);
        }
        .infer-btn.on:hover { background: #424245; border-color: #424245; }

                .fail-banner {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; margin-bottom: 10px;
            background: #fdf2f1;
            border: 1px solid rgba(179,38,30,0.18);
            border-radius: 12px;
            animation: fade-in 0.18s ease-out;
        }
        .fail-banner .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); flex-shrink: 0; }

        .settings-pop {
            position: absolute; bottom: calc(100% + 8px); right: 0;
            width: 260px;
            background: var(--bg-2);
            border: 1px solid var(--line-2);
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.10);
            z-index: 100;
            animation: pop-in 0.16s cubic-bezier(0.4,0,0.2,1);
            transform-origin: bottom right;
        }
        @keyframes pop-in { from{opacity:0;transform:scale(0.96) translateY(4px)} to{opacity:1;transform:scale(1) translateY(0)} }
        .setting-slider {
            padding: 10px 8px 12px;
        }
        .setting-slider input[type="range"] {
            width: 100%;
            margin: 9px 0 0;
            accent-color: var(--ink);
        }

        .toggle {
            width: 30px; height: 16px; border-radius: 999px;
            background: var(--line); position: relative; transition: all 0.22s ease;
            flex-shrink: 0;
        }
        .toggle[data-on="true"] { background: var(--ink); }
        .toggle::after {
            content: ""; position: absolute; top: 2px; left: 2px;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--bg-2);
            transition: all 0.22s ease;
        }
        .toggle[data-on="true"]::after { left: 16px; }

        .ping-pill {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.78);
            border: 1px solid rgba(0,0,0,0.06);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-radius: 999px;
            padding: 6px 12px;
            font-family: var(--font-sans); font-size: 12px; font-weight: 500;
            letter-spacing: -0.005em;
            color: var(--ink-2);
        }

        .kbd {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 16px; height: 16px; padding: 0 4px;
            background: var(--bg-2); border: 1px solid var(--line); border-radius: 2px;
            font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-3);
        }

        @keyframes step-in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .step-in { animation: step-in 0.35s cubic-bezier(0.4,0,0.2,1); }

        .landing-tag {
            position: absolute; top: 24px; left: 28px;
            font-family: var(--font-sans); font-size: 13px; font-weight: 600;
            letter-spacing: -0.005em; color: var(--ink);
            display: flex; align-items: center; gap: 8px; z-index: 12;
        }
        .landing-meta {
            position: absolute; top: 24px; right: 28px;
            font-family: var(--font-sans); font-size: 12px; font-weight: 500;
            letter-spacing: -0.005em; color: var(--ink-3); z-index: 12;
            text-align: right; line-height: 1.7;
        }
        .session-pill {
            position: absolute; bottom: 28px; left: 28px;
            font-family: var(--font-sans); font-size: 12px; font-weight: 500;
            letter-spacing: -0.005em; color: var(--ink-2);
            background: rgba(255,255,255,0.78);
            border: 1px solid rgba(0,0,0,0.06);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: 8px 14px; border-radius: 980px;
            z-index: 12;
        }
        .session-pill .live-d {
            display: inline-block; width: 6px; height: 6px; background: var(--good);
            border-radius: 50%; margin-right: 8px; animation: live-pulse 1.6s infinite;
        }

        .display-h {
            font-weight: 600;
            letter-spacing: -0.035em;
            line-height: 1.05;
        }
        .caption {
            font-size: 12px; color: var(--ink-3); letter-spacing: -0.005em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function App() {
    const isMobile = window.location.pathname.includes('mobile') || window.location.search.includes('view=mobile');
    return isMobile ? <MobileView /> : <PCView />;
}

const Icon = ({ d, s = 16, sw = 1.5, children }) => (
    <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor"
         strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        {d ? <path d={d} /> : children}
    </svg>
);

function MobileView() {
    const videoRef = useRef(null);
    const [connected, setConnected] = useState(false);
    const [currentAbs, setCurrentAbs] = useState(0);

    useEffect(() => {
        const init = async () => {
            try {
                // /config에서 LiveKit 접속 정보 수신 (토큰 하드코딩 제거)
                const cfg = await fetch('/config').then(r => r.json());
                const livekitUrl  = cfg.livekit_url;
                const mobileToken = cfg.mobile_token;
                if (!mobileToken) { alert('MOBILE_TOKEN이 서버 .env에 설정되지 않았습니다.'); return; }

                const LK   = window.LivekitClient;
                const room = new LK.Room();

                room.on('dataReceived', (payload) => {
                    try {
                        const data = JSON.parse(new TextDecoder().decode(payload));
                        if (data.type === 'pong') {
                            const rtt = Date.now() - data.client_time;
                            setCurrentAbs(Math.round(rtt / 2));
                            const m = JSON.stringify({ type:"metrics", rtt });
                            room.localParticipant.publishData(
                                new TextEncoder().encode(m), LK.DataPacket_Kind.LOSSY
                            );
                        }
                    } catch(e) {}
                });

                await room.connect(livekitUrl, mobileToken);

                const tracks = await LK.createLocalTracks({
                    video: {
                        facingMode: 'environment',
                        width:  { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 30, min: 24 },
                    }
                });
                const videoTrack = tracks.find(t => t.kind === 'video');
                if (videoRef.current && videoTrack) videoTrack.attach(videoRef.current);
                await room.localParticipant.publishTrack(videoTrack, {
                    simulcast: false,          // 단일 품질 고정
                    dynacast:  false,          // 자동 품질 조절 비활성화
                    videoEncoding: {
                        maxBitrate:    4_000_000,  // 최대 4Mbps
                        maxFramerate:  30,
                    },
                });
                setConnected(true);

                const interval = setInterval(() => {
                    if (room.state === 'connected') {
                        const ping = JSON.stringify({ type:"ping", send_time:Date.now() });
                        room.localParticipant.publishData(
                            new TextEncoder().encode(ping), LK.DataPacket_Kind.LOSSY
                        );
                    }
                }, 50);
                return () => { clearInterval(interval); room.disconnect(); };
            } catch(e) { alert('카메라 또는 LiveKit 연결 오류: ' + e.message); }
        };
        init();
    }, []);

    return (
        <div style={{height:'100vh', background:'#0a0a0a', color:'white', position:'relative', overflow:'hidden'}}>
            <video ref={videoRef} autoPlay playsInline muted
                   style={{width:'100%', height:'100%', objectFit:'cover', opacity:0.85}} />
            <div style={{position:'absolute', top:24, left:24, right:24, display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <span className="mono" style={{fontSize:11, letterSpacing:'0.28em', textTransform:'uppercase', color:'#fff'}}>● LiveKit</span>
                <span className="mono" style={{fontSize:11, letterSpacing:'0.18em', color:'#bbb'}}>ABS: {currentAbs}ms</span>
            </div>

        const saved = Number(localStorage.getItem('ttsRate') || 1.05);

    });
    const [mirrorOn, setMirrorOn] = useState(() => localStorage.getItem('mirrorOn') === '1');  // 카메라 좌우 반전(거울)
    const [autoInfer, setAutoInfer] = useState(false);
    const [autoInferInterval, setAutoInferInterval] = useState(() => {
        const saved = Number(localStorage.getItem('autoInferInterval') || 5);
        return Number.isFinite(saved) ? Math.max(1, Math.min(30, saved)) : 5;
    });
    const [settingsOpen, setSettingsOpen] = useState(false);

    const [rightWidth, setRightWidth]       = useState(340);   // 오른쪽 패널 너비 (드래그 조절)

    const [qrCodeUrl, setQrCodeUrl] = useState('');
    const [streamAlive, setStreamAlive] = useState(false);
    const [shutterKey, setShutterKey] = useState(0);
    const [previewSteps, setPreviewSteps] = useState([]);  // 파싱 프리뷰
    const sseRef = useRef(null);
    const [showHelp, setShowHelp] = useState(false);
    const passTimerRef = useRef(null);
    const prevAiResult = useRef('WAIT');
    const prevProcessingRef = useRef(false);
    const shutterTimerRef = useRef(null);
    const statusRef = useRef(status);
    const pingIntervalRef = useRef(null);

    /* edge-tts 재생 함수 — 서버 /tts 엔드포인트 사용, 실패 시 Web Speech 폴백 */
    const speakRef = useRef(null);  // 현재 재생 중인 Audio 객체

    const triggerShutterDelayed = useCallback(() => {
        if (shutterTimerRef.current) clearTimeout(shutterTimerRef.current);
        shutterTimerRef.current = setTimeout(() => {
            setShutterKey(k => k + 1);
            shutterTimerRef.current = null;
        }, 1000);
    }, []);

    const triggerShutterNow = useCallback(() => {
        if (shutterTimerRef.current) {
            clearTimeout(shutterTimerRef.current);
            shutterTimerRef.current = null;
        }
        setShutterKey(k => k + 1);
    }, []);

    const updateTtsRate = useCallback((value) => {
        const next = Math.max(0.7, Math.min(2.5, Number(value) || 1.05));
        setTtsRate(next);
        localStorage.setItem('ttsRate', String(next));
    }, []);

    const updateAutoInferInterval = useCallback((value) => {
        const next = Math.max(1, Math.min(30, Number(value) || 5));
        setAutoInferInterval(next);
        localStorage.setItem('autoInferInterval', String(next));
        fetch('/set-auto-infer-interval', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({interval_s: next}),
        }).catch(()=>{});
    }, []);

    useEffect(() => {
        fetch('/set-auto-infer-interval', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({interval_s: autoInferInterval}),
        }).catch(()=>{});
    }, []);

    useEffect(() => {
        return () => {
            if (shutterTimerRef.current) clearTimeout(shutterTimerRef.current);
        };
    }, []);
    const speak = useCallback((text) => {
        if (!text || !ttsOn) return;
        // 이전 재생 중지
        if (speakRef.current) { speakRef.current.pause(); speakRef.current = null; }
        window.speechSynthesis.cancel();

        const clean = text.replace(/^\[\w+\]\s*/, '').trim();
        if (!clean) return;

        // edge-tts 시도
        const audio = new Audio('/tts?text=' + encodeURIComponent(clean));
        audio.playbackRate = ttsRate;
        speakRef.current = audio;
        audio.play().catch(() => {
            // 더 새로운 speak()가 이 audio를 교체/중단했다면 폴백하지 않음
            // (AbortError로 인한 Web Speech 중복 재생 방지)
            if (speakRef.current !== audio) return;
            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'ko-KR'; u.rate = ttsRate;
            window.speechSynthesis.speak(u);
        });
    }, [ttsOn, ttsRate]);


    const inputRef = useRef(null);

    const [showCameraSetupPrompt, setShowCameraSetupPrompt] = useState(false);
    const [cameraSetupCompleteNotice, setCameraSetupCompleteNotice] = useState(false);
    const cameraSetupPromptedRef = useRef(false);
    const cameraSetupCompleteShownRef = useRef(false);

    /* QR 코드 생성 — view가 바뀔 때마다 재실행해서 터널 URL 반영 */
    useEffect(() => {
        if (view !== 'coach') return;  // 코치 화면일 때만 갱신
        const generateQR = (mobileUrl) => {
            try {
                const qr = qrcode(0, 'L');
                qr.addData(mobileUrl);
                qr.make();
                setQrCodeUrl(qr.createDataURL(4, 1));
                return mobileUrl;
            } catch(e) { console.error('QR 생성 실패:', e); return null; }
        };

        const tryGenerate = async () => {
            try {
                const cfg = await fetch('/config', {cache: 'no-store'}).then(r => r.json());
                if (cfg.mobile_url) {
                    const url = cfg.mobile_url.replace(/[/]$/,  '') + '/mobile';
                    generateQR(url);
                    return true;  // 터널 URL 확정 — 갱신 중단
                } else {
                    const base = window.location.protocol + '//' + window.location.host;
                    generateQR(base + '/mobile');
                    return false;  // 아직 터널 URL 없음 — 계속 재시도
                }
            } catch(e) {
                const base = window.location.protocol + '//' + window.location.host;
                generateQR(base + '/mobile');
                return false;
            }
        };

        // 즉시 1회 실행
        tryGenerate().then(done => {
            if (!done) {
                // 터널 URL 없으면 3초마다 재시도 (최대 30초)
                let attempts = 0;
                const interval = setInterval(async () => {
                    attempts++;
                    const done = await tryGenerate();
                    if (done || attempts >= 10) clearInterval(interval);
                }, 3000);
            }
        });
    }, [view]);  // view 바뀔 때마다 재실행

    /* PC 브라우저 → LiveKit 직접 수신 */
    useEffect(() => {
        if (view !== 'coach' || isDemo) return;
        const LK = window.LivekitClient;
        if (!LK) return;
        let cancelled = false;
        const room = new LK.Room({ adaptiveStream: false, dynacast: false });
        pcRoomRef.current = room;

        const attachVideo = (track) => {
            if (!track || track.kind !== 'video' || !pcVideoRef.current) return;
            track.attach(pcVideoRef.current);
            setStreamAlive(true);
        };

        room.on('trackSubscribed', attachVideo);
        room.on('trackUnsubscribed', () => {
            const v = pcVideoRef.current;
            if (!v || v.readyState === 0) setStreamAlive(false);
        });
        room.on('disconnected', () => setStreamAlive(false));


        fetch('/config', { cache:'no-store' }).then(r => r.json()).then(cfg => {
            if (!cfg.pc_token) { console.warn('PC_TOKEN 없음 — LiveKit 미사용'); return; }
            room.connect(cfg.livekit_url, cfg.pc_token, { autoSubscribe: true }).then(() => {
                if (cancelled) return;
                room.remoteParticipants.forEach(p =>
                    p.trackPublications.forEach(pub => {
                        if (pub.track?.kind === 'video') attachVideo(pub.track);
                    })
                );
            }).catch(e => console.error('PC LiveKit 오류:', e));
        });

        return () => {
            cancelled = true;
            setStreamAlive(false);
            try { room.disconnect(); } catch(e) {}
            pcRoomRef.current = null;
        };
    }, [view, isDemo]);


    /* 비디오 해상도 폴링 — 500ms마다 videoWidth/Height로 portrait 감지 */
    useEffect(() => {
        if (view !== 'coach' || !streamAlive) return;
        const id = setInterval(() => {
            const v = pcVideoRef.current;
            if (v && v.videoWidth > 0 && v.videoHeight > 0) {
                setIsPortrait(v.videoHeight > v.videoWidth);
            }
        }, 500);
        return () => clearInterval(id);
    }, [view, streamAlive]);

    /* 조립 시간 측정 — 카메라 첫 연결 시 시작 */
    useEffect(() => {
        if (view !== 'coach') {
            coachStartTime.current = null;  // 홈 돌아가면 초기화
            setLiveElapsed(0);
            liveElapsedRef.current = 0;
        }
    }, [view]);

    useEffect(() => {
        if (view !== 'coach') return;
        // 카메라 연결될 때마다 시작 시각 재설정 (첫 연결 시)
        if (status.has_frame && !coachStartTime.current) {
            coachStartTime.current = Date.now();
            setLiveElapsed(0);
            liveElapsedRef.current = 0;
        }
        // 카메라 끊기면 카운터 일시 정지 (시작 시각 유지)
        if (!status.has_frame) {
            setLiveElapsed(liveElapsedRef.current);  // 마지막 값 유지
        }
    }, [status.has_frame, view]);

    useEffect(() => {
        if (view !== 'coach') {
            cameraSetupPromptedRef.current = false;
            cameraSetupCompleteShownRef.current = false;
            setShowCameraSetupPrompt(false);
            setCameraSetupCompleteNotice(false);
            return;
        }
        if (!status.has_frame) {
            cameraSetupPromptedRef.current = false;
            cameraSetupCompleteShownRef.current = false;
            setShowCameraSetupPrompt(false);
            setCameraSetupCompleteNotice(false);
            return;
        }
        if (!cameraSetupPromptedRef.current && !status.camera_setup_done) {
            cameraSetupPromptedRef.current = true;
            setShowCameraSetupPrompt(true);
        }
    }, [status.has_frame, status.camera_setup_done, view]);

    const startCameraSetup = useCallback(() => {
        setShowCameraSetupPrompt(false);
        fetch('/start-camera-setup', {method:'POST'}).catch(()=>{});
    }, []);

    useEffect(() => {
        if (view !== 'coach' || !status.camera_setup_done || cameraSetupCompleteShownRef.current) return;
        cameraSetupCompleteShownRef.current = true;
        setCameraSetupCompleteNotice(true);
        const t = setTimeout(() => setCameraSetupCompleteNotice(false), 1500);
        return () => clearTimeout(t);
    }, [status.camera_setup_done, view]);

    useEffect(() => {
        if (view !== 'coach' || !status.has_frame) return;  // 카메라 연결 시에만 카운트
        const t = setInterval(() => {
            if (coachStartTime.current) {
                const elapsed = Math.floor((Date.now() - coachStartTime.current) / 1000);
                liveElapsedRef.current = elapsed;
                setLiveElapsed(elapsed);
            }
        }, 250);
        return () => clearInterval(t);
    }, [view, status.has_frame]);

    /* 카메라 연결 끊김 감지 → streamAlive 갱신 + QR 재생성 */
    const prevHasFrame = useRef(false);
    useEffect(() => {
        if (view !== 'coach') return;
        // has_frame이 false로 바뀌면 1초 후에 streamAlive 끔 (순간 깜빡임 방지)
        if (status.has_frame) setStreamAlive(true);
        // 연결됐다가 끊긴 경우 (true → false)
        if (prevHasFrame.current && !status.has_frame) {
            fetch('/config', {cache: 'no-store'})
                .then(r => r.json())
                .then(cfg => {
                    const mobileUrl = cfg.mobile_url
                        ? cfg.mobile_url.replace(/[/]$/, '') + '/mobile'
                        : window.location.protocol + '//' + window.location.host + '/mobile';
                    try {
                        const qr = qrcode(0, 'L');
                        qr.addData(mobileUrl);
                        qr.make();
                        setQrCodeUrl(qr.createDataURL(4, 1));
                    } catch(e) {}
                })
                .catch(() => {});
        }
        prevHasFrame.current = status.has_frame;
    }, [status.has_frame, view]);


    /* SSE — upload + uploading 상태 진입 시 /preview-steps 연결 */
    useEffect(() => {
        if (view !== 'upload' || !uploading) return;
        if (sseRef.current) { sseRef.current.close(); sseRef.current = null; }
        const sse = new EventSource('/preview-steps');
        sseRef.current = sse;
        sse.onmessage = (e) => {
            if (e.data === '__done__') { sse.close(); sseRef.current = null; return; }
            try {
                const newSteps = JSON.parse(e.data);
                setPreviewSteps(prev => {
                    const urls = new Set(prev.map(s => s.image_url));
                    return [...prev, ...newSteps.filter(s => !urls.has(s.image_url))];
                });
            } catch(err) { console.error('SSE 파싱 오류:', err); }
        };
        sse.onerror = () => console.warn('SSE 연결 오류');
        return () => { if (sseRef.current) { sseRef.current.close(); sseRef.current = null; } };
    }, [view, uploading]);

    useEffect(() => {
        if (isDemo) return;
        const t = setInterval(async () => {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                setStatus(data);
                statusRef.current = data;
                if (data.has_frame) setStreamAlive(true);
                if (view === 'coach' && data.has_frame && data.is_processing && !prevProcessingRef.current) {
                    triggerShutterDelayed();
                }
                prevProcessingRef.current = !!data.is_processing;
                if (typeof data.auto_infer_enabled === 'boolean') setAutoInfer(data.auto_infer_enabled);
                if (typeof data.auto_infer_interval_s === 'number' && !settingsOpen) setAutoInferInterval(data.auto_infer_interval_s);
                if (data.is_analyzed && data.manual_steps?.length > 0 && view === 'upload' && !uploading && !isNewStart) {
                    setView('coach');
                }
            } catch(e){}
        }, 250);
        return () => clearInterval(t);
    }, [view, uploading, isNewStart, settingsOpen, triggerShutterDelayed]);

    const uploadFiles = useCallback(async (files) => {
        if (!files || !files.length) return;
        // UI 먼저 전환 (reset은 백그라운드)
        setIsNewStart(false);
        setStatus(prev => ({...prev, analysis_time:0, elapsed_time:0, progress_step:'upload', is_analyzed:false, manual_steps:[], uploaded_preview:'', file_info:{name:'',pages:0,steps:0}}));
        setUploadError('');
        setUploadErrorCode('');
        setPreviewSteps([]);
        setUploading(true);
        setView('upload');
        fetch('/reset', {method:'POST'}).catch(()=>{});
        const fd = new FormData();
        for (let f of files) fd.append('files', f);
        fd.append('picture', 'false');  // 자동 판별: 표준 분석 후 번호 미검출 시 그림형으로 전환
        try {
            const res = await fetch('/process-manual', { method:'POST', body:fd });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.detail || `서버 오류 (${res.status})`);
            }
            const data = await res.json();
            if (data.status === 'success') {
                setUploadError('');
                setUploadErrorCode('');
                setUploading(false);
            } else {
                const err = new Error(data.message || '분석 실패');
                err.code = data.error_code || '';
                throw err;
            }
        } catch(e) {
            setUploading(false);
            setUploadError(e.message || '알 수 없는 오류가 발생했습니다.');
            setUploadErrorCode(e.code || '');
            setView('upload');
        }
    }, []);

    const onUpload = e => uploadFiles(e.target.files);
    const onDragOver  = useCallback(e => { e.preventDefault(); setIsDragging(true); }, []);
    const onDragLeave = useCallback(e => { e.preventDefault(); setIsDragging(false); }, []);
    const onDrop      = useCallback(e => { e.preventDefault(); setIsDragging(false); uploadFiles(e.dataTransfer.files); }, [uploadFiles]);

    const totalSteps = status.manual_steps?.length || 0;
    const activeIdx = userSelectedIdx !== null ? userSelectedIdx : status.current_step_idx;
    const currentStep = totalSteps > 0 ? status.manual_steps[activeIdx] : null;

    // 평면 STEP 목록을 메인 STEP 번호로 그룹화 (하위단계 2단계 네비용)
    const stepGroups = React.useMemo(() => {
        const groups = [];
        (status.manual_steps || []).forEach((s, i) => {
            const last = groups[groups.length - 1];
            if (last && last.step === s.step) { last.indices.push(i); }
            else { groups.push({ step: s.step, indices: [i] }); }
        });
        return groups;
    }, [status.manual_steps]);
    const activeGroup = stepGroups.find(g => g.indices.includes(activeIdx));
    const subIndexInGroup = activeGroup ? activeGroup.indices.indexOf(activeIdx) : 0;

    useEffect(() => {
        if (view !== 'coach') return;
        const el = stepRefs.current[activeIdx] || stepRefs.current[activeGroup ? activeGroup.indices[0] : activeIdx];
        if (el && listRef.current) el.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }, [activeIdx, view, activeGroup]);

    const cancelCountdown = useCallback(() => {
        if (passTimerRef.current) { clearTimeout(passTimerRef.current); passTimerRef.current = null; }
        setPassToast(false);
    }, []);

    const forceSetStep = useCallback(async (newIdx) => {
        const clamped = Math.max(0, Math.min(newIdx, totalSteps-1));
        cancelCountdown(); setShowFail(false);
        setUserSelectedIdx(clamped); setFlashKey(k => k+1);
        try { await fetch('/set-step', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({idx:clamped, locked:true}) }); } catch(e){}
    }, [totalSteps, cancelCountdown]);

    const goToPrev = useCallback(() => {
        const cur = userSelectedIdx !== null ? userSelectedIdx : status.current_step_idx;
        forceSetStep(cur-1);
    }, [userSelectedIdx, status.current_step_idx, forceSetStep]);

    const goToNext = useCallback(() => {
        const cur = userSelectedIdx !== null ? userSelectedIdx : status.current_step_idx;
        if (cur >= totalSteps-1) {
                setCompleteTime(liveElapsedRef.current > 0 ? liveElapsedRef.current : liveElapsed > 0 ? liveElapsed : 1);
                setShowComplete(true);
            }
        else forceSetStep(cur+1);
    }, [userSelectedIdx, status.current_step_idx, totalSteps, forceSetStep]);

    const triggerVLM = useCallback(async () => {
        if (isAnalyzing || !status.has_frame) return;
        triggerShutterNow();
        prevProcessingRef.current = true;
        setIsAnalyzing(true);
        try {
            const res = await fetch('/trigger-vlm', { method:'POST' });
            const data = await res.json();
            if (data.status !== 'success') alert(data.message || 'VLM 분석 실패');
        } catch(e) { alert('서버 오류'); }
        finally { setIsAnalyzing(false); }
    }, [isAnalyzing, status.has_frame, triggerShutterNow]);

    const toggleAutoInfer = useCallback(async () => {
        const next = !autoInfer;
        setAutoInfer(next);
        try {
            await fetch('/set-auto-infer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({enabled: next}),
            });
        } catch(e) {}
    }, [autoInfer]);

    const goHome = useCallback(async () => {
        cancelCountdown();
        setView('landing'); setUploading(false); setUserSelectedIdx(null);
        setShowComplete(false); setModalImg(null); setShowFail(false);
    }, [cancelCountdown]);

    /* TTS — AI feedback */
    useEffect(() => {
        if (view !== 'coach' || !ttsOn || !status.has_frame) return;
        const text = status.ai_feedback || status.ai_response;
        if (!text || text === prevAiResponse.current) return;
        prevAiResponse.current = text;
        // 대기/플레이스홀더 응답은 읽지 않음(스텝 안내 음성과 겹치거나 끊는 것 방지)
        if (/^(대기|WAIT)/i.test(text.replace(/^\[\w+\]\s*/, '').trim())) return;
        speak(text);
    }, [status.ai_feedback, status.ai_response, status.has_frame, view, ttsOn, speak]);

    /* TTS — step change */
    useEffect(() => {
        if (view !== 'coach' || !ttsOn || activeIdx === prevActiveIdx.current) return;
        prevActiveIdx.current = activeIdx;
        const cs = status.manual_steps?.[activeIdx];
        if (!cs) return;
        // 평면 인덱스가 아니라 매뉴얼의 실제 STEP 번호(+하위)로 안내
        const msg = cs.sub ? `${cs.step}단계 ${cs.sub}번` : `${cs.step}단계 시작합니다.`;
        speak(msg);
    }, [activeIdx, view, ttsOn, speak]);

    /* settings outside-click */
    useEffect(() => {
        if (!settingsOpen) return;
        const h = () => setSettingsOpen(false);
        const t = setTimeout(() => window.addEventListener('click', h), 0);
        return () => { clearTimeout(t); window.removeEventListener('click', h); };
    }, [settingsOpen]);

    /* AI result handling */
    useEffect(() => {
        if (view !== 'coach') return;
        const r = status.ai_result;
        if (!r || r === prevAiResult.current) return;
        prevAiResult.current = r;
        if (r === 'PASS') {
            if (passTimerRef.current) return;
            setPassToast(true);
            const latestIdx = statusRef.current.current_step_idx;
            setUserSelectedIdx(null); setFlashKey(k=>k+1);
            fetch('/set-step', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({idx:latestIdx, locked:false}) }).catch(()=>{});
            passTimerRef.current = setTimeout(() => { passTimerRef.current=null; setPassToast(false); }, 1800);
        } else if (r === 'FAIL') {
            if (passTimerRef.current) { clearTimeout(passTimerRef.current); passTimerRef.current=null; setPassToast(false); }
            // FAIL 메시지는 아래 큰 텍스트(ai_response)로 한 번만 표시. 음성도 ai_response effect가 처리.
        }
    }, [status.ai_result, view, ttsOn]);

    /* ping */
    useEffect(() => {
        if (view !== 'coach') {
            if (pingIntervalRef.current) { clearInterval(pingIntervalRef.current); pingIntervalRef.current = null; }
            setRtt(null); return;
        }
        const measure = async () => {
            try {
                const t0 = Date.now();
                const res = await fetch('/ping', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({client_time:t0}) });
                const d = await res.json(); setRtt(Date.now() - d.client_time);
            } catch(e) { setRtt(null); }
        };
        measure(); pingIntervalRef.current = setInterval(measure, 2000);
        return () => { clearInterval(pingIntervalRef.current); pingIntervalRef.current = null; };
    }, [view]);

    /* 화면 전환 시 카메라 세팅 메시지 초기화 */
    useEffect(() => {
        if (view !== 'coach') {
            const resetCamera = async () => {
                try {
                    await fetch('/reset-camera-setup', { method:'POST' }).catch(() => {});
                } catch(e) {}
            };
            resetCamera();
        }
    }, [view]);

    /* keyboard nav */
    useEffect(() => {
        if (view !== 'coach') return;
        const h = e => {
            if ((e.key.toLowerCase()==='s' || e.key==='ㄴ') && !e.repeat) {
                fetch('/stop-stepper', { method:'POST' }).catch(() => {});
                return;
            }
            if (modalImg) return;
            if (e.key==='ArrowRight') goToNext();
            if (e.key==='ArrowLeft') goToPrev();
            if (e.key.toLowerCase()==='l' && !e.repeat) fetch('/servo-angle', { method:'POST' }).catch(() => {});
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
    }, [view, goToNext, goToPrev, modalImg]);

    const isFirstStep = activeIdx <= 0;
    const isLastStep  = activeIdx >= totalSteps-1;
    const isLocked    = userSelectedIdx !== null || status.step_locked;
    const activeGesture = status.gesture || 'NONE';
    const gestureHolding = activeGesture.startsWith('HOLDING_') && status.gesture_holding_active !== false;
    const gestureHoldRequired = Number(status.gesture_hold_required || 1.5);

    const safePersistentHardwareNotice =
        activeGesture === 'UP' ? '리니어슬라이드 상승 중' :
        activeGesture === 'DOWN' ? '리니어슬라이드 하강 중' :
        null;
    const safeHoldingNotice =
        gestureHolding && activeGesture === 'HOLDING_TRACKING_OFF' ? '손 추적 중지 인식 중' :
        gestureHolding && activeGesture === 'HOLDING_TRACKING_ON' ? '손 추적 재개 인식 중' :
        gestureHolding && activeGesture === 'HOLDING_UP' ? '리니어슬라이드 상승 인식 중' :
        gestureHolding && activeGesture === 'HOLDING_DOWN' ? '리니어슬라이드 하강 인식 중' :
        null;
    const safeTrackingNotice = status.tracking_active === false ? '손 추적 OFF' : '손 추적 ON';
    const cameraSetupNotice =
        cameraSetupCompleteNotice ? '카메라 세팅이 완료됐습니다. 코칭을 시작합니다' :
        status.camera_setup_active ? (status.camera_setup_message || '카메라 초기 세팅 중') :
        null;
    const topRightNotice = cameraSetupNotice || safeHoldingNotice || hwNotice || safePersistentHardwareNotice || safeTrackingNotice;
    const hardwareBoxActive = !!(cameraSetupNotice || safeHoldingNotice || hwNotice || safePersistentHardwareNotice);
    const cameraSetupPhase = status.camera_setup_phase || 'idle';
    const cameraSetupCountdown = Number(status.camera_setup_countdown || 0);
    const cameraSetupGuideTitle =
        cameraSetupCompleteNotice ? '카메라 세팅이 완료됐습니다. 코칭을 시작합니다' :
        status.camera_setup_active && cameraSetupPhase === 'linear' ? '초기설정을 시작합니다' :
        status.camera_setup_active && cameraSetupPhase === 'hands_prompt' ? '양손을 작업대에 올려주세요' :
        status.camera_setup_active && cameraSetupPhase === 'pantilt' ? '카메라 각도를 조정합니다' :
        null;
    const cameraSetupGuideBody =
        status.camera_setup_active && cameraSetupPhase === 'linear' ? '어깨 정렬선에 맞춰 리니어슬라이드를 하강합니다.' :
        status.camera_setup_active && cameraSetupPhase === 'hands_prompt' ? '양손 전체가 보이도록 작업대 위에 올려주세요.' :
        status.camera_setup_active && cameraSetupPhase === 'pantilt' ? '양 손을 작업대에 올려주세요.' :
        '';

    useEffect(() => {
        if (!gestureHolding) {
            holdStartRef.current = null;
            holdGestureRef.current = null;
            setHoldDisplayElapsed(0);
            return;
        }

        const serverElapsed = Math.max(0, Number(status.gesture_hold_elapsed || 0));

        if (holdGestureRef.current !== activeGesture || holdStartRef.current === null) {
            holdGestureRef.current = activeGesture;
            holdStartRef.current = Date.now() - Math.min(serverElapsed, gestureHoldRequired) * 1000;
        }

        const update = () => {
            const elapsed = Math.min((Date.now() - holdStartRef.current) / 1000, gestureHoldRequired);
            setHoldDisplayElapsed(elapsed);
        };

        update();
        const t = setInterval(update, 50);
        return () => clearInterval(t);
    }, [activeGesture, gestureHolding, gestureHoldRequired, status.gesture_hold_elapsed]);

    useEffect(() => {
        if (activeGesture.startsWith('HOLDING_') || activeGesture === 'UP' || activeGesture === 'DOWN') {
            setHwNotice(null);
            return;
        }

        const message =
            activeGesture === 'STOP' ? '리니어슬라이드 정지' :
            activeGesture === 'TRACKING_OFF' ? '손 추적 OFF' :
            activeGesture === 'TRACKING_ON' ? '손 추적 ON' :
            null;

        if (!message) {
            setHwNotice(null);
            return;
        }
        setHwNotice(message);
        const t = setTimeout(() => setHwNotice(null), activeGesture === 'STOP' ? 1000 : 1600);
        return () => clearTimeout(t);
    }, [activeGesture]);

    return (
        <div style={{minHeight:'100vh', background:'var(--bg)', position:'relative'}}>

            {view === 'coach' && showCameraSetupPrompt && (
                <div className="modal-back">
                    <div style={{
                        width:'min(420px, calc(100vw - 36px))',
                        border:'1px solid var(--line)',
                        borderRadius:8,
                        background:'var(--panel)',
                        padding:22,
                        boxShadow:'0 24px 80px rgba(0,0,0,0.35)',
                    }}>
                        <div style={{fontSize:18, fontWeight:700, color:'var(--ink)', marginBottom:10}}>
                            카메라를 거치대에 끼워주세요
                        </div>
                        <div style={{fontSize:13, lineHeight:1.6, color:'var(--ink-3)', marginBottom:18}}>
                            카메라 거치가 완료되면 OK 버튼을 눌러 초기설정을 시작합니다.
                        </div>
                        <button className="btn primary" onClick={startCameraSetup} style={{width:'100%', justifyContent:'center'}}>
                            OK
                        </button>
                    </div>
                </div>

                                           objectFit: isPortrait ? 'contain' : 'cover',
                                           background:'#000',
                                           display: streamAlive ? 'block' : 'none',
                                           transform: mirrorOn ? 'scaleX(-1)' : 'none',
                                        }}/>
                                {streamAlive && shutterKey > 0 && (
                                    <div key={shutterKey} className="camera-shutter"/>
                                )}
                                {streamAlive && status.camera_setup_active && cameraSetupPhase === 'linear' && (
                                    <div style={{
                                        position:'absolute',
                                        left:0,
                                        right:0,
                                        top:`${Math.round(Number(status.camera_setup_shoulder_line_y || 0.48) * 100)}%`,
                                        zIndex:22,
                                        pointerEvents:'none',
                                    }}>
                                        <div style={{
                                            height:0,
                                            borderTop:'2px solid rgba(255,255,255,0.96)',
                                            boxShadow:'0 0 0 1px rgba(0,0,0,0.55), 0 0 18px rgba(0,0,0,0.35)',
                                        }}/>
                                        <div className="mono" style={{
                                            position:'absolute',
                                            left:14,
                                            top:-26,
                                            padding:'5px 8px',
                                            borderRadius:6,
                                            background:'rgba(255,255,255,0.94)',
                                            color:'var(--ink)',
                                            fontSize:10,
                                            letterSpacing:'0.12em',
                                            fontWeight:800,
                                        }}>
                                            SHOULDER LINE
                                        </div>
                                    </div>
                                )}
                                {!streamAlive && (
                                    /* ── QR 코드 표시 (미연결 시) ── */
                                    <div style={{textAlign:'center', color:'#666', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:'100%'}}>
                                        {qrCodeUrl ? (
                                            <>
                                                <div style={{background:'white', padding:14, borderRadius:12,
                                                             boxShadow:'0 0 40px rgba(255,255,255,0.1)', marginBottom:18}}>
                                                    <img src={qrCodeUrl} style={{width:180, height:180, display:'block'}} alt="Mobile QR"/>
                                                </div>
                                                <div className="mono" style={{fontSize:11, letterSpacing:'0.22em', textTransform:'uppercase', color:'#888', marginBottom:10}}>
                                                    Scan to Connect
                                                </div>
                                                <div style={{display:'inline-block', padding:'8px 16px', border:'1px solid #2a2a2a', borderRadius:2}}>
                                                    <code className="mono" style={{fontSize:11, color:'#aaa'}}>
                                                        {window.location.host}/mobile
                                                    </code>
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                <div style={{width:48, height:48, border:'1.5px solid #333', borderTopColor:'#fff',
                                                             borderRadius:'50%', animation:'spin 1.1s linear infinite', margin:'0 auto 20px'}}/>
                                                <div className="mono" style={{fontSize:11, letterSpacing:'0.32em', textTransform:'uppercase', color:'#888'}}>
                                                    Awaiting Stream
                                                </div>
                                            </>
                                        )}
                                    </div>
                                )}
                                <div style={{position:'absolute', top:14, left:14}}>
                                    <PingIndicator
                                        rtt={rtt}
                                        fps={status.current_fps}
                                        streamLevel={status.stream_level}
                                        liveElapsed={liveElapsed}
                                    />
                                </div>
                                {streamAlive && topRightNotice && (
                                    <div style={{
                                        position:'absolute',
                                        top:14,
                                        right:14,
                                        zIndex:30,
                                        maxWidth:'min(280px, calc(100% - 28px))',
                                        padding:'9px 11px',
                                        border:'1px solid rgba(255,255,255,0.22)',
                                        borderRadius:8,
                                        background:'rgba(12,14,18,0.68)',
                                        color:'#fff',
                                        backdropFilter:'blur(10px)',
                                        WebkitBackdropFilter:'blur(10px)',
                                        boxShadow:'0 12px 30px rgba(0,0,0,0.28)',
                                        pointerEvents:'none',
                                    }}>
                                        <div className="mono" style={{
                                            fontSize:9,
                                            letterSpacing:'0.18em',
                                            textTransform:'uppercase',
                                            color: hardwareBoxActive ? '#86efac' : (status.tracking_active === false ? '#fca5a5' : '#86efac'),
                                            marginBottom:4,
                                            whiteSpace:'nowrap',
                                        }}>
                                            {hardwareBoxActive ? 'H/W action' : 'Hand tracking'}
                                        </div>
                                        <div style={{
                                            fontSize:13,
                                            lineHeight:1.4,
                                            fontWeight:700,
                                            wordBreak:'keep-all',
                                        }}>
                                            {topRightNotice}
                                        </div>
                                        {gestureHolding && (
                                            <div className="mono" style={{
                                                marginTop:6,
                                                padding:'5px 7px',
                                                border:'1px solid rgba(255,255,255,0.18)',
                                                borderRadius:6,
                                                background:'rgba(255,255,255,0.08)',
                                                color:'#fde68a',
                                                fontSize:10,
                                                letterSpacing:'0.08em',
                                                textAlign:'center',
                                            }}>
                                                {holdDisplayElapsed.toFixed(1)}s / {gestureHoldRequired.toFixed(1)}s
                                            </div>
                                        )}
                                    </div>
                                )}
                                {false && liveElapsed > 0 && (
                                    <div style={{position:'absolute', top:14, right:14, zIndex:20}}>
                                        <div className="ping-pill">
                                            <span>⏱</span>
                                            <span className="mono">
                                                {Math.floor(liveElapsed/60) > 0 ? `${Math.floor(liveElapsed/60)}m ` : ''}{String(liveElapsed%60).padStart(2,'0')}s
                                            </span>
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div style={{background:'var(--bg-2)', borderTop:'1px solid var(--line)', padding:'18px 20px',
                                         display:'flex', alignItems:'flex-start', gap:18, minHeight:128, flexShrink:0}}>
                                <div style={{flex:1, minWidth:0}}>
                                    <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:6}}>
                                        <span className={`stat-dot ${
                                            isAnalyzing ? 'warn' :
                                            status.ai_result==='PASS' ? 'live' :
                                            status.ai_result==='FAIL' ? 'bad' : ''
                                        }`} style={{margin:0}}/>
                                        <span className="mono" style={{fontSize:10.5, letterSpacing:'0.22em', textTransform:'uppercase',
                                              color: isAnalyzing ? 'var(--warn)' :
                                                     status.ai_result==='PASS' ? 'var(--good)' :
                                                     status.ai_result==='FAIL' ? 'var(--bad)' : 'var(--ink-3)'}}>
                                            {isAnalyzing ? 'Vision · analyzing' :
                                             status.ai_result==='PASS' ? 'Vision · pass ✓' :
                                             status.ai_result==='FAIL' ? 'Vision · fail ✗' : 'Vision Analytics'}
                                        </span>
                                        {status.vlm_e2e_ms > 0 && (
                                            <span className="mono" style={{fontSize:10.5, letterSpacing:'0.12em', color:'var(--ink-4)'}}>
                                                · E2E {Math.round(status.vlm_e2e_ms)}ms
                                            </span>
                                        )}
                                    </div>
                                    <p style={{
                                        margin:0, fontSize:22, lineHeight:1.5, fontWeight:400, wordBreak:'keep-all',
                                        color: status.ai_result==='PASS' ? 'var(--good)' :
                                               status.ai_result==='FAIL' ? 'var(--bad)'  : 'var(--ink)',
                                        transition:'color 0.3s ease',
                                    }}>
                                        {status.has_frame ? status.ai_response : '모바일 기기를 연결하여 실시간 코칭을 받으세요.'}
                                    </p>
                                    {status.has_frame && status.ai_feedback && (
                                        <p style={{
                                            margin:'6px 0 0', fontSize:22, lineHeight:1.5, fontWeight:400,
                                            color:'var(--ink-2)', wordBreak:'keep-all',
                                        }}>
                                            {status.ai_feedback}
                                        </p>
                                    )}
                                </div>
                                <div style={{display:'flex', flexDirection:'column', gap:8, alignItems:'flex-end', flexShrink:0}}>
                                    <button className={`infer-btn ${autoInfer ? 'on' : 'off'}`}
                                            onClick={toggleAutoInfer}>
                                        <span style={{
                                            width:7, height:7, borderRadius:'50%',
                                            background: autoInfer ? '#4ade80' : 'var(--ink-4)',
                                            flexShrink:0,
                                            boxShadow: autoInfer ? '0 0 0 3px rgba(74,222,128,0.25)' : 'none',
                                            transition:'all 0.2s',
                                        }}/>
                                        {autoInfer ? '자동추론 ON' : '자동추론 OFF'}
                                    </button>
                                    {status.has_frame && (
                                        <button className="btn-spline" onClick={triggerVLM} disabled={isAnalyzing}
                                                style={{fontSize:13, padding:'9px 18px'}}>
                                            {isAnalyzing ? <>
                                                <span style={{width:11,height:11,border:'1.5px solid var(--bg)', borderTopColor:'transparent',
                                                              borderRadius:'50%', animation:'spin 0.8s linear infinite', display:'inline-block'}}/>
                                                Analyzing
                                            </> : 'VLM Analyze'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* 드래그 핸들 */}
                    <div
                        ref={rightDragRef}
                        onMouseDown={(e) => {
                            e.preventDefault();
                            const startX = e.clientX;
                            const startW = rightWidth;
                            const onMove = (ev) => {
                                const delta = startX - ev.clientX;
                                const newW  = Math.min(700, Math.max(240, startW + delta));
                                setRightWidth(newW);
                            };
                            const onUp = () => {
                                window.removeEventListener('mousemove', onMove);
                                window.removeEventListener('mouseup', onUp);
                            };
                            window.addEventListener('mousemove', onMove);
                            window.addEventListener('mouseup', onUp);
                        }}
                        style={{
                            width:6, flexShrink:0, cursor:'col-resize',
                            background:'transparent', position:'relative',
                            display:'flex', alignItems:'center', justifyContent:'center',
                            transition:'background 0.15s',
                        }}
                        onMouseEnter={e => e.currentTarget.style.background='var(--line)'}
                        onMouseLeave={e => e.currentTarget.style.background='transparent'}
                    >
                        <div style={{width:2, height:40, borderRadius:999, background:'var(--line-2)'}}/>
                    </div>

                    {/* RIGHT — 드래그 조절 가능한 매뉴얼 패널 */}
                    <aside style={{
                        width: rightWidth, minWidth: rightWidth,
                        display:'flex', flexDirection:'column', gap:12,
                        position:'relative', flexShrink:0, overflow:'hidden',
                        transition:'none',
                    }}>
                        <div className="surface" style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minHeight:0}}>
                            {currentStep ? (
                                <div key={flashKey} className="step-in" style={{display:'flex', flexDirection:'column', height:'100%', minHeight:0}}>
                                    <div style={{padding:'18px 20px 14px', borderBottom:'1px solid var(--line-2)',
                                                 display:'flex', alignItems:'baseline', justifyContent:'space-between'}}>
                                        <div>
                                            <div className="label">● 현재 단계</div>
                                            <div style={{fontSize:18, fontWeight:500, marginTop:4, letterSpacing:'-0.01em', display:'flex', alignItems:'baseline', gap:8}}>
                                                <span>STEP <span className="mono" style={{fontWeight:500}}>{String(currentStep.step).padStart(2,'0')}</span></span>
                                                {currentStep.label && (
                                                    <span className="mono" style={{fontSize:13, color:'var(--accent)', fontWeight:600}}>
                                                        {currentStep.label}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                        <span className="mono" style={{fontSize:10.5, color:'var(--ink-4)', letterSpacing:'0.1em'}}>
                                            {activeGroup ? `${stepGroups.indexOf(activeGroup)+1}/${stepGroups.length}` : `${activeIdx+1}/${totalSteps}`}
                                            {activeGroup && activeGroup.indices.length>1 ? ` · ${subIndexInGroup+1}/${activeGroup.indices.length}` : ''}
                                        </span>
                                    </div>
                                    <div style={{flex:'0 0 65%', padding:'0 18px 12px', display:'flex', flexDirection:'column', minHeight:0}}>
                                        <div className={`img-well${currentStep.extra_images?.length ? ' multi' : ''}`}
                                             onClick={currentStep.extra_images?.length ? undefined : () => setModalImg({src:currentStep.image_url, title:(currentStep.label||`STEP ${currentStep.step}`)})}>
                                            {currentStep.image_url ?
                                                (currentStep.extra_images?.length ?
                                                    [currentStep.image_url, ...currentStep.extra_images].map((src, i) =>
                                                        <img key={i} src={src} alt="step"
                                                             onClick={(e) => { e.stopPropagation(); setModalImg({src, title:(currentStep.label||`STEP ${currentStep.step}`)}); }}/>) :
                                                    <img src={currentStep.image_url} alt="step"/>) :
                                                <div className="img-well-placeholder">step · figure</div>}
                                        </div>
                                    </div>
                                    <div className="scroll" style={{flex:1, overflowY:'auto', padding:'4px 22px 22px', minHeight:60}}>
                                        <p style={{margin:0, fontSize:18, lineHeight:1.7, color:'var(--ink-2)', wordBreak:'keep-all'}}>
                                            {currentStep.desc.replace(/([가-힣a-zA-Z0-9,\.])\n([가-힣a-zA-Z])/g,'$1 $2').replace(/\n/g,' ').trim()}
                                        </p>
                                    </div>
                                </div>
                            ) : (
                                <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', padding:24}}>
                                    <div style={{textAlign:'center'}}>
                                        <div className="label" style={{marginBottom:10}}>● No data</div>
                                        <p style={{margin:0, fontSize:14, color:'var(--ink-4)', maxWidth:200, lineHeight:1.5}}>
                                            매뉴얼 분석 후 단계 정보가 표시됩니다.
                                        </p>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="surface" style={{padding:'16px 18px'}}>
                            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8}}>
                                <span className="label">단계 이동</span>
                                <span className="mono" style={{fontSize:10.5, color:'var(--ink-3)', letterSpacing:'0.1em'}}>
                                    {totalSteps>0 ? `${activeIdx+1} / ${totalSteps}` : '— / —'}
                                </span>
                            </div>
                            <div style={{height:2, background:'var(--line-2)', borderRadius:999, overflow:'hidden', marginBottom:14}}>
                                <div style={{height:'100%', background:'var(--ink)',
                                             width: totalSteps>0 ? `${((activeIdx+1)/totalSteps)*100}%` : '0%',
                                             transition:'width 0.3s ease'}}/>
                            </div>
                            <div style={{display:'flex', gap:8}}>
                                <button className="btn-quiet" onClick={goToPrev} disabled={isFirstStep || totalSteps===0} style={{flex:1}}>
                                    <Icon s={11}><polyline points="15 18 9 12 15 6"/></Icon> Prev
                                </button>
                                <button className="btn-spline" onClick={goToNext} disabled={totalSteps===0} style={{flex:1}}>
                                    {isLastStep ? '완료 ✓' : <>Next <Icon s={11}><polyline points="9 18 15 12 9 6"/></Icon></>}
                                </button>
                            </div>
                            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:12}}>
                                <div style={{display:'flex', alignItems:'center', gap:6}}>
                                    <span className="kbd">←</span><span className="kbd">→</span>
                                    <span className="mono" style={{fontSize:10, color:'var(--ink-4)', letterSpacing:'0.1em', marginLeft:4}}>keyboard</span>
                                </div>
                                <span className="mono" style={{fontSize:10, letterSpacing:'0.16em', textTransform:'uppercase',
                                      color: isLocked ? 'var(--warn)' : 'var(--good)'}}>
                                    {isLocked ? '● Manual' : '● AI Auto'}
                                </span>
                            </div>
                        </div>
                    </aside>

                    <style>{`@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }`}</style>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
