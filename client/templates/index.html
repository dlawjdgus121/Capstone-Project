<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Coach Camera - 1200px High Speed</title>
</head>
<body style="margin:0; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
    
    <h3 id="status" style="color: #ffaa00;">🟡 카메라 권한 허용 대기 중...</h3>
    <video id="video" autoplay playsinline style="width:100%; max-height:80vh; object-fit:cover;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
        let ws;

        async function startCamera() {
            try {
                // 1. 하드웨어 요청: 1280x960 (약 1200급 4:3 비율)과 30FPS를 요구
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment', 
                        width: { ideal: 1280 },  
                        height: { ideal: 960 }, 
                        frameRate: { ideal: 30 } 
                    }, 
                    audio: false 
                });
                video.srcObject = stream;
                status.innerText = "🟡 서버에 연결 중...";
                connectWebSocket();
            } catch (err) {
                status.innerText = "❌ 카메라 권한이 차단되었습니다.";
                status.style.color = "#ff4444";
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                status.innerText = "🟢 [초고속 모드] 20FPS+ 방어 중";
                status.style.color = "#00ff00";
                sendFrames();
            };
            ws.onclose = () => {
                status.innerText = "🔴 연결 끊김 (재연결 중)";
                status.style.color = "#ff4444";
                setTimeout(connectWebSocket, 3000);
            };
        }

        function sendFrames() {
            if (ws.readyState === WebSocket.OPEN && video.readyState === video.HAVE_ENOUGH_DATA) {
                
                // 2. 버퍼 기준 타이트하게 조정 (0.5MB만 쌓여도 스킵해서 딜레이 원천 차단)
                if (ws.bufferedAmount > 500 * 1024) {
                    setTimeout(sendFrames, 33);
                    return;
                }

                // 3. 캔버스 해상도 강제 리사이징 (최대 1200px)
                let w = video.videoWidth || 1280;
                let h = video.videoHeight || 960;
                const MAX_SIZE = 1200;
                
                if (w > MAX_SIZE || h > MAX_SIZE) {
                    const ratio = Math.min(MAX_SIZE / w, MAX_SIZE / h);
                    w = w * ratio;
                    h = h * ratio;
                }
                
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // 4. 화질 0.6(60%)으로 가볍게 압축
                canvas.toBlob((blob) => { if (blob) ws.send(blob); }, 'image/jpeg', 0.6);
            }
            
            // 5. 전송 주기 33ms (초당 약 30번 찔러서 실제 20~25FPS 이상 확보)
            setTimeout(sendFrames, 33); 
        }
        startCamera();
    </script>
</body>
</html>
